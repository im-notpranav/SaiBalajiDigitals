<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SB OMS — Sai Balaji Digitals</title>
    <meta name="description" content="Enterprise Order Management System for Sai Balaji Digitals — where excellence meets precision." />
    <meta property="og:title" content="SB OMS — Sai Balaji Digitals" />
    <meta property="og:description" content="Enterprise Order Management System — Employee, Production, Accountant and Administrator portals." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" href="/favicon-dark-32x32.png" type="image/png" sizes="32x32" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0b8ce0" />
    <!-- Runs before the first paint so a dark-mode user never sees a white flash. See lib/theme.ts. -->
    <script>
      try {
        if (localStorage.getItem("sb-theme") === "dark") {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').content = "#0f1320";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
