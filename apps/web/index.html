<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SB OMS — Sai Balaji Digitals</title>
    <meta name="description" content="Enterprise Order Management System for Sai Balaji Digitals — where excellence meets precision." />
    <meta property="og:title" content="SB OMS — Sai Balaji Digitals" />
    <meta property="og:description" content="Enterprise Order Management System — Employee, Production, Accountant and Administrator portals." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/brand-logo.css" />
    <link rel="icon" href="/favicon-dark-32x32.png" type="image/png" sizes="32x32" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0b8ce0" />
    <!-- Runs before the first paint so a dark-mode user never sees a white flash. See lib/theme.ts. -->
    <script>
      try {
        if (localStorage.getItem("sb-theme") === "dark") {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').content = "#0f1320";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- First-paint splash, built before any JavaScript arrives. main.tsx fades it out once the
         sign-in check is done. Styles: public/brand-logo.css. -->
    <div id="sb-splash" class="sb-splash" role="status" aria-label="Loading">
      <div id="sb-splash-logo" class="sb-logo sb-idle" style="opacity:0;width:128px;height:128px" aria-hidden="true">
        <i class="sb-float">
          <i class="sb-sway-a"><i class="sb-part sb-arc-blue"></i></i>
          <i class="sb-sway-b"><i class="sb-part sb-arc-orange"></i></i>
          <i class="sb-cube"><i class="sb-part sb-cube-left"></i><i class="sb-part sb-cube-right"></i></i>
          <i class="sb-part sb-shadow"></i>
          <i class="sb-part sb-word"></i>
        </i>
      </div>
      <span class="sb-bar" aria-hidden="true"></span>
    </div>
    <script>
      // Start the assembly only once its pieces are decoded, so none pops in half-way through.
      (function () {
        var logo = document.getElementById("sb-splash-logo");
        var set = document.documentElement.classList.contains("dark") ? "dark" : "light";
        var parts = ["arc-blue", "arc-orange", "cube-left", "cube-right", "word"];
        if (set === "light") parts.push("shadow");
        var started = false;
        function start() {
          if (started) return;
          started = true;
          logo.style.opacity = "";
          logo.classList.add("sb-play");
          window.__sbSplashStart = performance.now();
        }
        Promise.all(
          parts.map(function (p) {
            var img = new Image();
            img.src = "/logo-parts/" + set + "-" + p + ".webp";
            return img.decode ? img.decode().catch(function () {}) : Promise.resolve();
          })
        ).then(start);
        setTimeout(start, 1500);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
